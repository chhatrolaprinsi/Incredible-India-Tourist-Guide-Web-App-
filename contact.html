<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Incredible India</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background: url("img/background.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #333;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: black;
      padding: 15px 40px;
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
    }
    .logo {
      display: flex;
      align-items: center;
    }
    .logo img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin-right: 10px;
    }
    .logo-text {
      font-size: 20px;
      font-weight: bold;
      color: orange;
    }
    .tagline {
      font-size: 12px;
      color: white;
    }
    .menu a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      transition: color 0.3s ease;
    }
    .menu a:hover {
      color: orange;
    }
    .contact-container {
      background: #fff;
      padding: 25px;
      width: 400px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
      margin-top: 60px;
      max-width: 90%;
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #34495e;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    textarea {
      resize: none;
      height: 80px;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background: orange;
      border: none;
      color: black;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: black;
      color: orange;
    }
    .error {
      color: red;
      font-size: 13px;
      margin-top: 3px;
    }
    .success {
      text-align: center;
      color: green;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">
      <img src="img/Travel Logo.jpg" alt="Travel Logo">
      <div>
        <div class="logo-text">Incredible India</div>
        <div class="tagline">Explore the beauty of India</div>
      </div>
    </div>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
  <div class="contact-container">
    <h2>Contact Us</h2>
    <form id="contactForm" onsubmit="return validateForm()">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name">
      <div id="nameError" class="error"></div>

      <label for="email">Email:</label>
      <input type="text" id="email" placeholder="Enter your email">
      <div id="emailError" class="error"></div>

      <label for="phone">Phone:</label>
      <input type="text" id="phone" placeholder="Enter your phone number">
      <div id="phoneError" class="error"></div>

      <label for="message">Message:</label>
      <textarea id="message" placeholder="Write your message"></textarea>
      <div id="messageError" class="error"></div>

      <button type="submit">Send Message</button>
    </form>
    <div id="successMessage" class="success"></div>
  </div>
  <script>
    function validateForm() {
      let name = document.getElementById("name").value.trim();
      let email = document.getElementById("email").value.trim();
      let phone = document.getElementById("phone").value.trim();
      let message = document.getElementById("message").value.trim();

      document.getElementById("nameError").innerHTML = "";
      document.getElementById("emailError").innerHTML = "";
      document.getElementById("phoneError").innerHTML = "";
      document.getElementById("messageError").innerHTML = "";
      document.getElementById("successMessage").innerHTML = "";

      if (name === "") {
        document.getElementById("nameError").innerHTML = "Name is required";
        return false;
      }
      if (email === "" || !email.includes("@")) {
        document.getElementById("emailError").innerHTML = "Valid email is required";
        return false;
      }
      if (phone === "" || isNaN(phone) || phone.length < 10) {
        document.getElementById("phoneError").innerHTML = "Valid phone number is required";
        return false;
      }
      if (message === "") {
        document.getElementById("messageError").innerHTML = "Message is required";
        return false;
      }

      document.getElementById("successMessage").innerHTML = "Message sent successfully!";
      document.getElementById("contactForm").reset();
      return false;
    }
  </script>
</body>
</html>
